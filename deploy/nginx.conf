server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's mime.types already maps .wasm to application/wasm

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm text/x-python image/svg+xml;
    gzip_min_length 1024;

    # Vite output is content hashed, safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and entry page must always be revalidated so updates are picked up
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
