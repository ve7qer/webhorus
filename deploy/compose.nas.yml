services:
  web:
    image: webhorus-web:latest
    container_name: webhorus-web
    restart: unless-stopped
    # No host port published — reached only via the tailscale sidecar
    # (serve.json proxies to http://web:80 over the internal network).
    expose:
      - "80"

  tailscale:
    image: tailscale/tailscale:latest
    container_name: webhorus-tailscale
    hostname: webhorus
    restart: unless-stopped
    environment:
      # Optional, from the stack .env file. If empty, the container logs a
      # login.tailscale.com URL to authorise the node once; state is persisted.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale-config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    depends_on:
      - web

volumes:
  tailscale_state:
    driver: local
