services:
  web:
    image: webhorus-web:latest
    container_name: webhorus-web
    restart: unless-stopped
    # No host port published — reached only via the tailscale sidecar
    # (serve.json proxies to http://web:80 over the internal network).
    expose:
      - "80"

  tailscale:
    image: tailscale/tailscale:latest
    container_name: webhorus-tailscale
    hostname: webhorus
    restart: unless-stopped
    environment:
      # From the stack .env file. Only needed for the first login, after which
      # the node state is kept in the tailscale_state volume. (Without a key the
      # container's login URL is only valid for ~60 s before it restarts.)
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale-config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    depends_on:
      - web

volumes:
  tailscale_state:
    driver: local
